<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#1b1f24; --sub:#5b6470; --line:#e3e6eb; --brand:#1f4fd1;
  --s1:#1f6feb; --s1bg:#e8f0fe; --s2:#c2620a; --s2bg:#fdf0e1;
  --ok:#137a3f; --okbg:#e6f5ec; --warn:#a15c00; --warnbg:#fff4e0; --bad:#b42318; --badbg:#fdecea;
  --muted:#9aa3ad; --radius:12px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit}
.wrap{max-width:980px;margin:0 auto;padding:16px}
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
header.top h1{font-size:16px;margin:0;flex:1}
header.top .who{font-size:13px;color:var(--sub)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--card)}
.tabs .wrap{display:flex;gap:4px;padding-top:0;padding-bottom:0}
.tab{border:0;background:none;padding:12px 12px;color:var(--sub);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--brand);border-color:var(--brand);font-weight:600}
.subtabs{display:inline-flex;background:#eceff3;border-radius:10px;padding:3px;margin-bottom:14px}
.subtabs button{border:0;background:none;padding:7px 14px;border-radius:8px;cursor:pointer;color:var(--sub)}
.subtabs button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 10px}
.card h3{font-size:14px;margin:14px 0 8px;color:var(--sub)}
.muted{color:var(--sub);font-size:13px}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 14px;cursor:pointer;color:var(--ink)}
.btn:hover{background:#f3f5f8}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:#f2c4bf}
.btn.ok{color:var(--ok);border-color:#b9dfc8}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;min-width:0}
.field label{font-size:13px;color:var(--sub)}
input[type=text],input[type=password],input[type=number],input[type=datetime-local],input[type=url],select{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;width:100%;min-width:0}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid transparent;white-space:nowrap;vertical-align:middle}
.tag.s1{background:var(--s1bg);color:var(--s1)} .tag.s2{background:var(--s2bg);color:var(--s2)}
.tag.ok{background:var(--okbg);color:var(--ok)} .tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.bad{background:var(--badbg);color:var(--bad)} .tag.gray{background:#eef0f3;color:var(--sub)}
.tag.line{border-color:var(--line);color:var(--sub);background:#fff}
.sem{border-left:4px solid var(--s1);padding-left:12px;margin-bottom:18px}
.sem.s2{border-left-color:var(--s2)}
.sem h3{margin:0 0 8px;color:var(--ink);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:#fff;font-size:14px}
.chip.done{background:#f3f4f6;color:var(--sub)}
.chip small{color:var(--muted);margin-left:4px}
.grp{font-size:12px;color:var(--sub);margin:6px 0 4px}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-bottom:8px;font-size:13px}
.chain .node{padding:4px 8px;border-radius:8px;border:1px dashed var(--line);color:var(--muted)}
.chain .node.have{border-style:solid;border-color:var(--brand);color:var(--brand);background:#eef2fd;font-weight:600}
.chain .arr{color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:#fff}
.opt input{margin-top:4px}
.opt.dis{background:#f5f6f8;color:var(--muted);cursor:not-allowed}
.opt .why{font-size:12px;color:var(--warn);display:block;margin-top:2px}
.opt.sel{border-color:var(--brand);box-shadow:0 0 0 2px #d6e0fb}
.steps{display:flex;gap:4px;margin:10px 0}
.steps span{flex:1;text-align:center;font-size:12px;padding:5px 2px;border-radius:7px;background:#eef0f3;color:var(--muted)}
.steps span.on{background:var(--brand);color:#fff}
.req{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;background:#fff}
.req .sw{font-size:15px}
.req .sw b{font-weight:600}
.bundle{border:1px solid #c9d6f7;background:#f7f9ff;border-radius:12px;padding:12px;margin-bottom:12px}
.notice{padding:12px 14px;border-radius:10px;background:var(--warnbg);color:var(--warn);margin-bottom:12px;font-size:14px}
.notice.info{background:#eef2fd;color:#1f3f9a}
.notice.bad{background:var(--badbg);color:var(--bad)}
.errs{margin:8px 0 0;padding-left:18px;color:var(--bad);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:600;background:#fafbfc}
.tbl{overflow-x:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--sub)}
.login{max-width:380px;margin:8vh auto 0;padding:0 16px}
.login .card{padding:22px}
.login h1{font-size:20px;margin:0 0 4px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1b1f24;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;max-width:90vw;display:none;z-index:50;white-space:pre-line}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.55);display:none;align-items:center;justify-content:center;z-index:40}
#busy div{width:34px;height:34px;border:3px solid #cfd6e3;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:rgba(15,20,30,.45);display:flex;align-items:center;justify-content:center;z-index:45;padding:16px}
.modal .box{background:#fff;border-radius:14px;max-width:480px;width:100%;padding:20px;max-height:85vh;overflow:auto}
.modal h3{margin:0 0 10px;font-size:17px}
.modal .act{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.warnline{color:var(--bad);font-size:13px;margin-top:10px;font-weight:600}
#print-area{display:none}
.slips{display:grid;grid-template-columns:1fr 1fr;gap:0}
.slip{border:1px dashed #999;padding:14px 16px;page-break-inside:avoid;font-size:13px}
.slip .nm{font-size:16px;font-weight:700}
.slip .cd{font:700 24px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:4px;margin:6px 0}
.slip .url{word-break:break-all;font-size:11px;color:#444}
@media print{
  body>*:not(#print-area){display:none!important}
  #print-area{display:block!important}
  .no-print{display:none!important}
}
@media (max-width:560px){
  .wrap{padding:12px}
  .hide-m{display:none}
  .slips{grid-template-columns:1fr}
}
textarea{width:100%;min-width:0;background:#fff}
.login{max-width:440px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="busy"><div></div></div>
<script>
var BOOT = <?!= boot ?>;
<?!= logic ?>
</script>
<script>
var S = { token: null, user: null, tab: null, home: null, sub: 'single', f: null, rows: null, tc: null, admin: {} };
var STORE = (function () { try { sessionStorage.setItem('_t', '1'); sessionStorage.removeItem('_t'); return sessionStorage; } catch (e) { return null; } })();

function $(sel) { return document.querySelector(sel); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function busy(on) { $('#busy').style.display = on ? 'flex' : 'none'; }
function toast(msg, ms) {
  var t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, ms || 3500);
}
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  busy(true);
  return new Promise(function (res, rej) {
    var r = google.script.run.withSuccessHandler(function (v) { busy(false); res(v); })
      .withFailureHandler(function (e) {
        busy(false);
        var m = (e && e.message) || String(e);
        if (m.indexOf('SESSION_EXPIRED') >= 0) { logoutLocal('로그인 시간이 지났거나 비밀번호가 바뀌었습니다. 다시 로그인하세요.'); return; }
        rej(new Error(m));
      });
    r[fn].apply(r, args);
  });
}
function fail(e) { toast(e.message || String(e), 6000); }

function modal(title, html, okText, danger) {
  return new Promise(function (res) {
    var m = document.createElement('div');
    m.className = 'modal';
    m.innerHTML = '<div class="box"><h3>' + esc(title) + '</h3><div>' + html + '</div><div class="act">' +
      (okText ? '<button class="btn" data-x="0">취소</button>' : '') +
      '<button class="btn ' + (danger ? 'danger' : 'pri') + '" data-x="1">' + esc(okText || '닫기') + '</button></div></div>';
    m.addEventListener('click', function (ev) {
      var x = ev.target.getAttribute('data-x');
      if (x === null) return;
      if (x === '1' && m.querySelector('[data-required]') && !m.querySelector('[data-required]').checked) {
        toast('확인 항목에 체크하세요.'); return;
      }
      res(x === '1' ? (m.querySelector('[data-value]') ? m.querySelector('[data-value]').value || true : true) : false);
      document.body.removeChild(m);
    });
    document.body.appendChild(m);
  });
}
var IRREV = '<div class="warnline">확정 후에는 되돌릴 수 없습니다.</div>';

function semTag(key) { var p = String(key).split('-'); return '<span class="tag s' + p[1] + '">' + esc(p[0] + '-' + p[1]) + '</span>'; }
function semName(key) { var p = String(key).split('-'); return p[0] + '학년 ' + p[1] + '학기'; }
function statusTag(s) {
  var cls = { '대기': 'gray', '매칭됨': 'warn', '동의완료': 'ok', '승인': 'ok', '반려': 'bad', '취소': 'bad', '기한만료': 'bad', '동의대기': 'warn', '보류': 'bad', '해제': 'gray' }[s] || 'gray';
  return '<span class="tag ' + cls + '">' + esc(s) + '</span>';
}
function shortL(l) { return String(l).replace(/^\[\d-\d\] /, ''); }

/* 과목표는 페이지와 함께 받는다(BOOT.courses). 검증 함수(validateDeclared_ 등)도 페이지에 들어 있다 */
function C() { return BOOT.courses; }
function courseArr() { return Object.keys(BOOT.courses).sort().map(function (k) { return BOOT.courses[k]; }); }
/** 학년·반·번호 드롭다운 3개. 학년은 1·2학년만 */
function gcnSelects(p, onchange) {
  var sel = function (id, label, from, to, unit) {
    var o = '<option value="">선택</option>';
    for (var i = from; i <= to; i++) o += '<option value="' + i + '">' + i + unit + '</option>';
    return '<div class="field" style="flex:1;min-width:0"><label>' + label + '</label><select id="' + p + id + '"' + (onchange ? ' onchange="' + onchange + '"' : '') + '>' + o + '</select></div>';
  };
  return '<div class="row" style="flex-wrap:nowrap">' + sel('g', '학년', 1, 2, '학년') + sel('c', '반', 1, BOOT.classes || 12, '반') + sel('n', '번호', 1, BOOT.maxNo || 40, '번') + '</div>';
}
function gcnValue(p) {
  var g = $('#' + p + 'g').value, c = $('#' + p + 'c').value, n = $('#' + p + 'n').value;
  return g && c && n ? { grade: g, cls: c, no: n } : null;
}

/* ───── 로그인 ───── */

function boot() {
  var t = STORE && STORE.getItem('token'), u = STORE && STORE.getItem('user');
  if (t && u) { S.token = t; S.user = JSON.parse(u); route(); return; }
  renderLogin();
}
function renderLogin(msg, kind) {
  kind = kind || 'resume';
  var tabs = [['new', '처음 신청하기'], ['resume', '이어서 하기'], ['teacher', '교사']];
  $('#app').innerHTML = '<div class="login"><div class="card">' +
    '<h1>선택과목 교환 신청</h1><p class="muted" style="margin:0 0 16px">이미 확정된 선택과목을 다른 학생과 맞바꾸고 싶을 때 신청하세요.<br>1학년은 2학년 과목, 2학년은 3학년 과목을 바꿀 수 있습니다.</p>' +
    '<div class="subtabs">' + tabs.map(function (t) { return '<button data-k="' + t[0] + '" class="' + (kind === t[0] ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') + '</div>' +
    (msg ? '<div class="notice bad" style="white-space:pre-line">' + esc(msg) + '</div>' : '') + '<div id="lbody"></div></div></div>';
  document.querySelectorAll('.subtabs button').forEach(function (b) { b.onclick = function () { renderLogin('', b.getAttribute('data-k')); }; });
  if (kind === 'new') renderRegister(); else renderSignIn(kind);
}
function renderSignIn(kind) {
  var stu = kind === 'resume';
  $('#lbody').innerHTML =
    (stu ? gcnSelects('l') : '<div class="field"><label>교사ID</label><input id="lid" type="text" autocomplete="username"></div>') +
    (stu ? '<div class="field"><label>이름</label><input id="lname" type="text" autocomplete="name"></div>' : '') +
    '<div class="field"><label>' + (stu ? '비밀번호 (처음 신청할 때 정한 4자리)' : '비밀번호') + '</label><input id="lpw" type="password" ' + (stu ? 'inputmode="numeric" maxlength="4"' : '') + ' autocomplete="current-password"></div>' +
    '<button id="lgo" class="btn pri" style="width:100%">들어가기</button>' +
    (stu ? '<p class="muted" style="margin:14px 0 0">비밀번호를 잊었으면 담임 선생님께 재설정을 요청하세요.</p>' : '');
  var go = function () {
    if (stu && !gcnValue('l')) { toast('학년·반·번호를 모두 고르세요.'); return; }
    var args = stu ? ['student', gcnValue('l'), $('#lpw').value, $('#lname').value] : ['teacher', $('#lid').value, $('#lpw').value];
    call.apply(null, ['login'].concat(args)).then(function (r) {
      if (!r.ok) { renderLogin(r.msg, kind); return; }
      startSession(r);
    }).catch(function (e) { renderLogin(e.message, kind); });
  };
  $('#lgo').onclick = go;
  $('#lpw').onkeydown = function (e) { if (e.key === 'Enter') go(); };
  if (!stu) $('#lid').focus();
}
function renderRegister() {
  if (!BOOT.open) {
    $('#lbody').innerHTML = '<div class="notice">지금은 신청 기간이 아닙니다.<br><span class="muted">(' + esc(BOOT.start || '-') + ' ~ ' + esc(BOOT.end || '-') + ')</span></div>';
    return;
  }
  $('#lbody').innerHTML =
    '<div class="notice info" style="white-space:pre-line;font-size:13px">' + esc(BOOT.notice) + '</div>' +
    '<label class="row" style="margin-bottom:14px"><input type="checkbox" id="ragree"> <b>위 내용을 읽었고 동의합니다.</b></label>' +
    gcnSelects('r', 'gcnHint()') + '<div id="rHint" class="muted" style="font-size:13px;margin:-6px 0 12px"></div>' +
    '<div class="field"><label>이름</label><input id="rname" type="text"></div>' +
    '<div class="row"><div class="field" style="flex:1"><label>비밀번호 정하기 (숫자 4자리)</label><input id="rp1" type="password" inputmode="numeric" maxlength="4"></div>' +
    '<div class="field" style="flex:1"><label>한 번 더</label><input id="rp2" type="password" inputmode="numeric" maxlength="4"></div></div>' +
    '<p class="muted" style="margin-top:0">이 비밀번호로 나중에 진행 상황을 보고 교환에 동의합니다. 다른 친구에게 알려주지 마세요.</p>' +
    '<button id="rgo" class="btn pri" style="width:100%">등록하고 신청하러 가기</button>';
  $('#rgo').onclick = function () {
    var v = gcnValue('r');
    if (!v) { toast('학년·반·번호를 모두 고르세요.'); return; }
    if ($('#rp1').value !== $('#rp2').value) { toast('비밀번호가 서로 다릅니다.'); return; }
    call('stRegister', { grade: v.grade, cls: v.cls, no: v.no, name: $('#rname').value, pin: $('#rp1').value, agree: $('#ragree').checked })
      .then(function (r) { S.tab = 'apply'; startSession(r); toast('등록했습니다. 이제 교환을 신청하세요.'); })
      .catch(function (e) { renderLogin(e.message, 'new'); });
  };
}
function gcnHint() {
  var g = $('#rg').value;
  $('#rHint').innerHTML = g ? g + '학년은 <b>' + allowedSems_(g).map(semName).join(', ') + '</b> 과목을 바꿀 수 있습니다.' : '';
}
function startSession(r) {
  S.token = r.token; S.user = r.user;
  if (r.home) S.home = r.home;
  if (STORE) { STORE.setItem('token', r.token); STORE.setItem('user', JSON.stringify(r.user)); }
  route();
}
function logoutLocal(msg) {
  if (STORE) { STORE.removeItem('token'); STORE.removeItem('user'); }
  var kind = S.user && S.user.role !== 'student' ? 'teacher' : 'resume';
  S = { token: null, user: null, tab: null, home: null, sub: 'single', f: null, rows: null, tc: null, admin: {} };
  renderLogin(msg, kind);
}
function logout() { var t = S.token; logoutLocal(); if (t) google.script.run.logout(t); }
function route() { if (S.user.role === 'student') loadStudent(); else loadTeacher(); }

function shell(title, who, tabs, active) {
  return '<header class="top"><div class="wrap"><h1>' + esc(title) + '</h1><span class="who hide-m">' + esc(who) +
    '</span><button class="btn sm" onclick="logout()">로그아웃</button></div></header>' +
    '<nav class="tabs"><div class="wrap">' + tabs.map(function (t) {
      return '<button class="tab ' + (t[0] === active ? 'on' : '') + '" onclick="go(\'' + t[0] + '\')">' + t[1] + '</button>';
    }).join('') + '</div></nav><main class="wrap" id="main"></main>';
}
function go(tab) { S.tab = tab; route(); }

/* ───── 학생 ───── */

function loadStudent() {
  if (S.home) { renderStudent(); return; }
  call('stHome', S.token).then(function (h) { S.home = h; renderStudent(); }).catch(fail);
}
function reloadStudent() { S.home = null; loadStudent(); }
function refreshStudent(h) { S.home = h; renderStudent(); }
function mySems() { return allowedSems_(S.home.me.grade); }

function renderStudent() {
  var h = S.home, me = h.me;
  if (!S.tab || ['apply', 'status'].indexOf(S.tab) < 0) S.tab = h.reqs.length ? 'status' : 'apply';
  var need = {};
  h.reqs.forEach(function (r) { if (canRespond([r])) need[r.bundle || r.id] = true; });
  var n = Object.keys(need).length;
  $('#app').innerHTML = shell('선택과목 교환 신청', me.grade + '학년 ' + me.cls + '반 ' + me.no + '번 ' + me.name,
    [['apply', '교환 신청'], ['status', '진행 상황' + (n ? ' <span class="tag bad">' + n + '</span>' : '')]], S.tab);
  var period = '<div class="notice ' + (h.open ? 'info' : '') + '">' +
    (h.open ? '신청 기간입니다. ' : '지금은 신청 기간이 아닙니다. 조회만 할 수 있습니다. ') +
    '<span class="muted">(' + esc(h.period.start || '-') + ' ~ ' + esc(h.period.end || '-') + ')</span> <button class="btn sm" onclick="reloadStudent()">새로고침</button></div>';

/* 진행 상황 */
function groupsOf(reqs) {
  var groups = [], seen = {};
  reqs.forEach(function (r) {
    if (r.bundle) { if (seen[r.bundle]) return; seen[r.bundle] = true; groups.push(reqs.filter(function (x) { return x.bundle === r.bundle; }).sort(function (a, b) { return a.sem < b.sem ? -1 : 1; })); }
    else groups.push([r]);

}
function canRespond(g) {

}
function viewStatus() {

  } else if (r.status === '대기') {

function aDoPurge() {
  var t = $('#pgx').value;
  modal('개인정보 일괄 삭제', '<p>신청자와 신청 데이터를 모두 지웁니다.</p>' + IRREV, '삭제', true).then(function (ok) {
    if (!ok) return;
    call('adPurge', S.token, t).then(function (r) {
      S.tc = null;
      modal('삭제 완료', '<p>신청자 ' + r.applicants + '명, 신청 ' + r.requests + '건을 삭제했습니다.</p>').then(loadTeacher);
    }).catch(fail);
  });
}

/* 내 계정 */
function tAcct() {
  $('#main').innerHTML = '<div class="card" style="max-width:420px"><h2>비밀번호 변경</h2>' +
    '<div class="field"><label>현재 비밀번호</label><input type="password" id="p0"></div>' +
    '<div class="field"><label>새 비밀번호 (8자 이상)</label><input type="password" id="p1"></div>' +
    '<div class="field"><label>새 비밀번호 확인</label><input type="password" id="p2"></div>' +
    '<button class="btn pri" onclick="tPw()">변경</button></div>';
}
function tPw() {
  if ($('#p1').value !== $('#p2').value) { toast('새 비밀번호가 서로 다릅니다.'); return; }
  call('tcChangePw', S.token, $('#p0').value, $('#p1').value).then(function () { toast('비밀번호를 바꿨습니다.'); tAcct(); }).catch(fail);
}

boot();
</script>
